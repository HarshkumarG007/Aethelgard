services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - aethelgard-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Note: sslmode=disable is acceptable only across the isolated Docker bridge network.
      # When connecting to a remote or managed database (e.g. Neon, Supabase), you MUST use sslmode=require.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aethelgard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aethelgard}?sslmode=disable
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_PASSPHRASE_HASH=${ADMIN_PASSPHRASE_HASH}
      - VIEWER_PASSPHRASE_HASH=${VIEWER_PASSPHRASE_HASH}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-${CLOUDFLARE_R2_ACCOUNT_ID}}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-${CLOUDFLARE_R2_ACCESS_KEY_ID}}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-${CLOUDFLARE_R2_SECRET_ACCESS_KEY}}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-${CLOUDFLARE_R2_BUCKET_NAME}}
      - NEXT_PUBLIC_SITE_ORIGIN=${NEXT_PUBLIC_SITE_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aethelgard-internal

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aethelgard}
      POSTGRES_USER: ${POSTGRES_USER:-aethelgard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aethelgard} -d ${POSTGRES_DB:-aethelgard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aethelgard-internal

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  aethelgard-internal:
    driver: bridge
