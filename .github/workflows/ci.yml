name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline:
    name: Baseline Verification (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aethelgard
          POSTGRES_USER: aethelgard
          POSTGRES_PASSWORD: dev-only-password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aethelgard:dev-only-password@localhost:5434/aethelgard
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      VIEWER_PASSPHRASE: aethelgard-visitor-dev-passphrase-2026
      ADMIN_PASSPHRASE: aethelgard-admin-dev-passphrase-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Push database schema
        run: npm run db:push

      - name: Seed database credentials
        run: npm run db:seed

      - name: Seed sanctuary content
        run: npm run db:seed:sanctuary

      - name: Generate synthetic dev media
        run: npx tsx scripts/generate-dev-media.ts

      - name: Run Unit Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://aethelgard:dev-only-password@localhost:5434/aethelgard
