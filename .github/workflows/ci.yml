name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline:
    name: Baseline Verification (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://aethelgard:dev-only-password@localhost:5432/aethelgard
